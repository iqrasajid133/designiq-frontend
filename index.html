<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DesignIQ AI — One Platform. Every Design Tool.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#070B14;--card:#0F172A;--pur:#7C3AED;--purl:#A855F7;--cyn:#22D3EE;--grn:#22C55E;--wht:#F8FAFC;--mut:#94A3B8;--bdr:rgba(148,163,184,0.1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--wht);font-family:'Inter',sans-serif;overflow-x:hidden}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
.page{min-height:80vh;background:var(--bg)}
nav{background:rgba(7,11,20,.98);border-bottom:1px solid var(--bdr);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:100}
.lm{display:flex;align-items:center;gap:8px;cursor:pointer}
.lmark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#7C3AED,#22D3EE);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff}
.ltxt{font-weight:800;font-size:15px;color:var(--wht)}
.ltxt em{color:var(--purl);font-style:normal}
.nlinks{display:flex;gap:2px}
.nl{color:var(--mut);font-size:12px;font-weight:500;padding:5px 10px;border-radius:6px;cursor:pointer;transition:all .2s;border:none;background:transparent;font-family:inherit}
.nl.on{color:var(--wht);font-weight:700;background:rgba(124,58,237,.12)}
.nr{display:flex;gap:8px;align-items:center}
.cpill{background:var(--card);border:1px solid var(--bdr);border-radius:7px;padding:4px 10px;font-size:12px;display:flex;gap:5px;align-items:center}
.bgh{background:transparent;border:1px solid var(--bdr);color:var(--mut);padding:5px 13px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
.bp{background:linear-gradient(135deg,#7C3AED,#A855F7);border:none;color:#fff;padding:5px 15px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.bp:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(124,58,237,.4)}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:13px}
.hero{position:relative;overflow:hidden;padding:64px 20px 56px;text-align:center}
.orb1{position:absolute;top:-60px;left:-60px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.16) 0%,transparent 70%);pointer-events:none}
.orb2{position:absolute;bottom:-80px;right:-40px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.1) 0%,transparent 70%);pointer-events:none}
.hinner{position:relative;z-index:1;max-width:740px;margin:0 auto}
.hbadge{display:inline-flex;align-items:center;gap:7px;background:rgba(124,58,237,.13);border:1px solid rgba(124,58,237,.3);border-radius:100px;padding:4px 12px;font-size:11px;font-weight:700;color:var(--purl);letter-spacing:.07em;text-transform:uppercase;margin-bottom:20px;animation:pu .6s ease both}
.bdot{width:5px;height:5px;border-radius:50%;background:var(--cyn);display:inline-block;animation:pulse 2s infinite}
h1.htitle{font-family:'Space Grotesk',sans-serif;font-size:clamp(34px,5.5vw,62px);font-weight:900;line-height:1.05;letter-spacing:-.03em;color:var(--wht);margin-bottom:16px;animation:pu .6s .1s ease both}
.hgrad{background:linear-gradient(135deg,#A855F7,#22D3EE);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hsub{font-size:clamp(14px,2vw,17px);color:var(--mut);max-width:500px;margin:0 auto 28px;line-height:1.75;animation:pu .6s .2s ease both}
.hbtns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;animation:pu .6s .3s ease both}
.bigh{padding:11px 24px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:all .2s;text-decoration:none;border:none}
.bigh-p{background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff}
.bigh-p:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(124,58,237,.45)}
.bigh-s{background:rgba(255,255,255,.06);border:1px solid var(--bdr);color:var(--wht)}
.stats{display:flex;align-items:center;justify-content:center;gap:32px;margin-top:40px;flex-wrap:wrap;animation:pu .6s .4s ease both}
.sn{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:800;color:var(--wht);display:block}
.sl{font-size:11px;color:var(--mut);display:block;margin-top:2px}
.sdv{width:1px;height:30px;background:var(--bdr)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:1px;background:var(--bdr);border-radius:14px;overflow:hidden;border:1px solid var(--bdr);margin-top:36px}
.tc{background:var(--card);padding:18px;cursor:pointer;transition:background .2s;position:relative;overflow:hidden}
.tc:hover{background:#131e35}
.tico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:11px;font-size:16px;transition:transform .2s}
.tc:hover .tico{transform:scale(1.1)}
.tn{font-weight:800;font-size:13px;color:var(--wht);margin-bottom:4px}
.td{font-size:11px;color:var(--mut);line-height:1.5;margin-bottom:8px}
.tbadge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;display:inline-block}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;margin-top:40px}
.ba-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;overflow:hidden}
.ba-top{padding:11px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:6px}
.dots{display:flex;gap:4px}
.dot{width:8px;height:8px;border-radius:50%}
.ba-body{display:grid;grid-template-columns:1fr 1fr;position:relative;min-height:160px}
.ba-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:16px}
.col-lbl{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px}
.ba-line{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--bdr);display:flex;align-items:center;justify-content:center}
.ba-ico{width:22px;height:22px;border-radius:50%;background:var(--card);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--purl)}
.fstats{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px}
.fst{background:var(--card);border:1px solid var(--bdr);border-radius:9px;padding:10px 12px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:40px}
.sc{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:22px;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#7C3AED,#22D3EE)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:40px}
.pc{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:26px;position:relative;transition:all .3s}
.pc:hover{transform:translateY(-3px)}
.pc.feat{border-color:rgba(124,58,237,.45);background:linear-gradient(145deg,rgba(124,58,237,.1),var(--card))}
.fpill{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff;font-size:9px;font-weight:800;padding:3px 12px;border-radius:20px;white-space:nowrap}
.wslayout{display:grid;grid-template-columns:1fr 270px;height:calc(100vh - 108px)}
.wsmain{overflow-y:auto;padding:16px;border-right:1px solid var(--bdr)}
.wssidebar{background:#0a0e1a;overflow-y:auto}
.udz{border:2px dashed rgba(124,58,237,.3);border-radius:13px;background:rgba(124,58,237,.04);padding:36px 20px;text-align:center;cursor:pointer;transition:all .25s}
.udz.drag,.udz:hover{border-color:rgba(168,85,247,.6);background:rgba(124,58,237,.08)}
.sb-sec{padding:14px 14px 12px;border-bottom:1px solid var(--bdr)}
.sb-lbl{font-size:9px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.mcard{padding:8px 10px;border-radius:8px;border:1.5px solid var(--bdr);cursor:pointer;transition:all .2s;margin-bottom:4px}
.mcard.sel{border-color:rgba(124,58,237,.55);background:rgba(124,58,237,.08)}
.mcard:hover{border-color:rgba(124,58,237,.3)}
.mcdot{width:6px;height:6px;border-radius:50%;background:#334155;transition:background .2s;flex-shrink:0}
.mcard.sel .mcdot{background:var(--purl)}
input[type=range]{width:100%;accent-color:var(--pur);height:4px;cursor:pointer}
.cbrow{display:flex;align-items:center;gap:8px;margin-bottom:9px;cursor:pointer}
.cb{width:15px;height:15px;border-radius:4px;border:1.5px solid rgba(148,163,184,.25);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.cb.chk{background:var(--pur);border-color:var(--pur)}
select{background:var(--card);border:1px solid var(--bdr);border-radius:7px;padding:7px 9px;color:var(--wht);font-size:12px;font-family:inherit;outline:none;width:100%;cursor:pointer}
.vecbtn{width:100%;padding:11px;background:linear-gradient(135deg,#7C3AED,#A855F7);border:none;color:#fff;font-size:13px;font-weight:800;border-radius:9px;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px}
.vecbtn:disabled{background:rgba(124,58,237,.2);color:#64748b;cursor:not-allowed}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.dstat{background:var(--card);border:1px solid var(--bdr);border-radius:11px;padding:16px 18px}
.twocol{display:grid;grid-template-columns:200px 1fr;gap:14px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th{padding:7px 14px;font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;text-align:left;border-bottom:1px solid var(--bdr)}
td{padding:10px 14px;font-size:12px;border-bottom:1px solid var(--bdr)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#131e35}
.stabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--bdr)}
.stab{padding:9px 14px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--mut);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:color .2s;font-family:inherit}
.stab.on{color:var(--wht);font-weight:700;border-bottom-color:var(--purl)}
.scard{background:var(--card);border:1px solid var(--bdr);border-radius:12px;overflow:hidden;margin-bottom:12px}
.scard-h{padding:14px 18px;border-bottom:1px solid var(--bdr)}
.scard-b{padding:16px 18px}
.sfield{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--bdr)}
.sfield:last-child{border-bottom:none}
.tog{width:38px;height:21px;border-radius:100px;cursor:pointer;transition:background .2s;position:relative;flex-shrink:0;border:none}
.tog-k{width:15px;height:15px;border-radius:50%;background:#fff;position:absolute;top:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.inp{background:rgba(148,163,184,.07);border:1px solid var(--bdr);border-radius:7px;padding:7px 10px;color:var(--wht);font-size:12px;font-family:inherit;outline:none}
.asec{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:20px 22px;margin-bottom:10px}
.faqw{display:flex;flex-direction:column;gap:1px;background:var(--bdr);border-radius:12px;overflow:hidden;border:1px solid var(--bdr)}
.faqit{background:var(--card);cursor:pointer}
.sec{padding:48px 20px}
.si{max-width:1100px;margin:0 auto}
.slbl{font-size:10px;font-weight:700;color:var(--purl);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
h2.st{font-family:'Space Grotesk',sans-serif;font-size:clamp(22px,3.5vw,34px);font-weight:800;color:var(--wht);letter-spacing:-.02em;margin-bottom:10px}
.ss{font-size:14px;color:var(--mut);max-width:440px;line-height:1.7}
footer{border-top:1px solid var(--bdr);padding:28px 20px;background:var(--bg)}
.fgd{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
@media(max-width:780px){
  nav{padding:0 12px;height:50px}
  .nlinks{display:none}
  .nr{gap:6px}
  .cpill{display:none}
  .bgh{padding:5px 10px;font-size:11px}
  .bp{padding:5px 12px;font-size:11px}
  .hero{padding:36px 14px 36px}
  .stats{gap:18px}
  .sdv{height:24px}
  .sn{font-size:19px}
  .sec{padding:32px 14px}
  .si{padding:0}
  .fgrid{grid-template-columns:1fr;gap:24px}
  .tgrid{grid-template-columns:repeat(2,1fr)}
  .pgrid{grid-template-columns:1fr}
  .sgrid{grid-template-columns:1fr}
  .dgrid{grid-template-columns:repeat(2,1fr)}
  .twocol{grid-template-columns:1fr}
  .wslayout{display:flex;flex-direction:column;height:auto;min-height:calc(100vh - 96px)}
  .wsmain{border-right:none;border-bottom:1px solid var(--bdr);padding:12px}
  .wssidebar{max-height:none}
  table{display:block;overflow-x:auto;white-space:nowrap}
  .scard-b > div[style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr!important}
  h1.htitle{font-size:clamp(28px,8vw,40px)}
  .hsub{font-size:14px}
  .ba-body img,.ba-body svg{max-width:54px}
}
@media(max-width:480px){
  .tgrid{grid-template-columns:1fr}
  .dgrid{grid-template-columns:1fr}
  .stats{gap:12px}
  .sdv{display:none}
  .bigh{padding:9px 18px;font-size:13px}
}
</style>
</head>
<body>

<div id="app"></div>

<script>
const C={bg:"#070B14",card:"#0F172A",pur:"#7C3AED",purl:"#A855F7",cyn:"#22D3EE",grn:"#22C55E",amb:"#FCD34D",wht:"#F8FAFC",mut:"#94A3B8",bdr:"rgba(148,163,184,0.1)"};

const TOOLS=[
  {id:"vec",name:"VectorizeIQ",cat:"Vector",tag:"Popular",free:true,credits:5,c:C.purl,ibg:"rgba(124,58,237,0.18)",desc:"PNG/JPG → clean SVG vectors"},
  {id:"rbg",name:"RemoveBG IQ",cat:"Editing",tag:"Free",free:true,credits:3,c:C.cyn,ibg:"rgba(34,211,238,0.13)",desc:"AI background removal"},
  {id:"ups",name:"UpscaleIQ",cat:"Enhancement",tag:"4K",free:false,credits:10,c:C.purl,ibg:"rgba(124,58,237,0.18)",desc:"2×/3×/4× AI upscaling"},
  {id:"enh",name:"Logo EnhanceIQ",cat:"Enhancement",tag:"New",free:true,credits:4,c:C.grn,ibg:"rgba(34,197,94,0.13)",desc:"Sharpen and clean logos"},
  {id:"svg",name:"SVG OptimizeIQ",cat:"Optimize",tag:"",free:true,credits:2,c:C.cyn,ibg:"rgba(34,211,238,0.13)",desc:"SVGO — 70%+ size reduction"},
  {id:"cmp",name:"CompressIQ",cat:"Optimize",tag:"",free:true,credits:2,c:C.amb,ibg:"rgba(251,191,36,0.12)",desc:"80% file size reduction"},
  {id:"pal",name:"Color PaletteIQ",cat:"Analysis",tag:"",free:true,credits:1,c:C.purl,ibg:"rgba(124,58,237,0.18)",desc:"Extract brand colors"},
  {id:"cnv",name:"ConverterIQ",cat:"Convert",tag:"",free:true,credits:1,c:C.cyn,ibg:"rgba(34,211,238,0.13)",desc:"Convert any image format"},
  {id:"qr",name:"QR GeneratorIQ",cat:"Generate",tag:"",free:true,credits:2,c:C.grn,ibg:"rgba(34,197,94,0.13)",desc:"Branded QR codes"},
  {id:"mck",name:"MockupIQ",cat:"Generate",tag:"Soon",free:false,credits:0,c:C.mut,ibg:"rgba(148,163,184,0.07)",desc:"Device mockup placement",soon:true},
];

let page="landing",wFile=null,wPreview=null,wMode="color",wDetail=70,wSmooth=60,wNoise=40,wTransBg=true,wMerge=true,wStatus="idle",wProgress=0,wStep="",wResult=null,wResultSize="",wDrag=false,billing="monthly",stab="Profile",notifs={done:true,digest:false,updates:true,limit:true,billing:true},appear={theme:"dark",compact:false,credits:true,anim:true},saved=false;

// Backend connection — auto-detects localhost, otherwise edit this for your deployed backend URL
const API_BASE = (location.hostname==="localhost"||location.hostname==="127.0.0.1") ? "http://localhost:4000" : "https://YOUR-BACKEND-URL.com";

const app=document.getElementById("app");

function r(){app.innerHTML=nav()+pages[page]();}

function nav(){
  const links=[{k:"landing",l:"Home"},{k:"tools",l:"Tools"},{k:"workspace",l:"Workspace"},{k:"pricing",l:"Pricing"},{k:"dashboard",l:"Dashboard"},{k:"about",l:"About"},{k:"settings",l:"Settings"}];
  return`<nav>
  <div class="lm" onclick="go('landing')">
    <div class="lmark">D</div>
    <span class="ltxt">DesignIQ <em>AI</em></span>
  </div>
  <div class="nlinks">${links.map(l=>`<button class="nl${page===l.k?" on":""}" onclick="go('${l.k}')">${l.l}</button>`).join("")}</div>
  <div class="nr">
    <div class="cpill"><span style="color:${C.cyn};font-weight:700">250</span><span style="color:${C.mut}">credits</span></div>
    <button class="bgh">Sign in</button>
    <button class="bp">Start free</button>
  </div>
</nav>`;
}

function go(p){page=p;r();}

const pages={

landing:()=>`<div class="page">
<div class="hero">
  <div class="orb1"></div><div class="orb2"></div>
  <div class="hinner">
    <div class="hbadge"><span class="bdot"></span>VectorizeIQ 2.0 — Now live</div>
    <h1 class="htitle">One Platform.<br><span class="hgrad">Every Design Tool.</span></h1>
    <p class="hsub">Professional AI tools for designers and agencies. Vectorize, remove backgrounds, upscale, compress — one workspace.</p>
    <div class="hbtns">
      <button class="bigh bigh-p" onclick="go('tools')">▦ Explore all tools</button>
      <button class="bigh bigh-s" onclick="go('pricing')">View pricing →</button>
    </div>
    <div class="stats">
      <div><span class="sn">250K+</span><span class="sl">Files processed</span></div>
      <div class="sdv"></div>
      <div><span class="sn">9</span><span class="sl">AI tools</span></div>
      <div class="sdv"></div>
      <div><span class="sn">4K</span><span class="sl">Max export</span></div>
      <div class="sdv"></div>
      <div><span class="sn">Free</span><span class="sl">To start</span></div>
    </div>
  </div>
</div>

<div class="sec">
  <div class="si">
    <div class="slbl">AI Tools</div>
    <h2 class="st">Every design tool you need</h2>
    <p class="ss">Nine specialized AI tools. One platform. No app-switching.</p>
    <div class="tgrid">
      ${TOOLS.map(t=>`<div class="tc" onclick="${t.soon?"":"go('workspace')"}" style="opacity:${t.soon?.55:1}">
        <div class="tico" style="background:${t.ibg}">
          <span style="color:${t.c}">⬡</span>
        </div>
        <div class="tn">${t.name}</div>
        <div class="td">${t.desc}</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          ${t.free?`<span class="tbadge" style="background:rgba(34,197,94,.12);color:${C.grn}">FREE</span>`:""}
          ${t.tag?`<span class="tbadge" style="background:${t.tag==="Soon"?"rgba(251,191,36,.1)":"rgba(168,85,247,.13)"};color:${t.tag==="Soon"?C.amb:C.purl}">${t.tag}</span>`:""}
        </div>
      </div>`).join("")}
    </div>
  </div>
</div>

<div class="sec" style="background:#07091a">
  <div class="si">
    <div class="fgrid">
      <div>
        <div class="slbl">VectorizeIQ</div>
        <h2 class="st">Raster to vector,<br>in seconds</h2>
        <p class="ss" style="margin-bottom:22px">Upload any PNG or JPG — get color-accurate SVG with editable paths. Print-ready at any size.</p>
        ${[["#A855F7","Full-color vectorization","Each color region → separate editable SVG path."],["#22D3EE","Smart path smoothing","Noise reduction and edge smoothing built in."],["#22C55E","SVG, PNG, PDF, EPS export","Every professional format you need."]].map(([c,t,d])=>`<div style="display:flex;gap:11px;margin-bottom:14px">
          <div style="width:30px;height:30px;border-radius:8px;background:rgba(124,58,237,.14);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;color:${c};font-size:13px">✓</div>
          <div><div style="font-weight:700;font-size:13px;color:${C.wht};margin-bottom:2px">${t}</div><div style="font-size:12px;color:${C.mut};line-height:1.5">${d}</div></div>
        </div>`).join("")}
        <button class="bigh bigh-p" style="margin-top:10px" onclick="go('workspace')">Try VectorizeIQ →</button>
      </div>
      <div>

        ${[["Stack","React · Node.js · Sharp"],["Version","1.0.0"],["Year","2026"]].map(([l,v])=>`<div class="card" style="padding:8px 14px;text-align:center"><div style="font-size:9px;font-weight:700;color:${C.mut};text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">${l}</div><div style="font-size:12px;color:${C.wht};font-weight:600">${v}</div></div>`).join("")}
      </div>
      <div style="margin-top:14px;font-size:11px;color:${C.mut}">© 2026 DesignIQ AI · All rights reserved</div>
    </div>
  </div>
</div>`

};

function toggleFaq(i){
  const a=document.getElementById("faqa-"+i);
  const ico=document.getElementById("faqico-"+i);
  const open=a.style.display!=="none";
  document.querySelectorAll("[id^='faqa-']").forEach(el=>el.style.display="none");
  document.querySelectorAll("[id^='faqico-']").forEach(el=>{el.style.transform="none"});
  if(!open){a.style.display="block";ico.style.transform="rotate(45deg)";}
}
function togglePFaq(i){
  const a=document.getElementById("pfaqa-"+i);
  const ico=document.getElementById("pfaqico-"+i);
  const open=a.style.display!=="none";
  document.querySelectorAll("[id^='pfaqa-']").forEach(el=>el.style.display="none");
  document.querySelectorAll("[id^='pfaqico-']").forEach(el=>{el.style.transform="none"});
  if(!open){a.style.display="block";ico.style.transform="rotate(45deg)";}
}
function setMode(m){wMode=m;r();}
function setDrag(v){wDrag=v;const z=document.getElementById("udz");if(z){v?z.classList.add("drag"):z.classList.remove("drag");}}
function doDrop(e){e.preventDefault();setDrag(false);pickFile(e.dataTransfer.files[0]);}
function pickFile(f){
  if(!f||!f.type.startsWith("image/"))return;
  wFile=f;wResult=null;wStatus="idle";
  const rd=new FileReader();
  rd.onload=ev=>{wPreview=ev.target.result;r();};
  rd.readAsDataURL(f);
}
function clearFile(){wFile=null;wPreview=null;wResult=null;wStatus="idle";r();}
async function runVec(){
  if(!wFile||wStatus==="loading")return;
  wStatus="loading";wProgress=10;wResult=null;wStep="Uploading image…";r();

  const fd=new FormData();
  fd.append("image",wFile);
  fd.append("mode",wMode);
  fd.append("detail",wDetail);
  fd.append("smoothness",wSmooth);
  fd.append("noiseCleanup",wNoise);
  fd.append("transparent",wTransBg);
  fd.append("mergeSimilar",wMerge);

  try{
    wProgress=40;wStep="Processing on server…";r();
    const res=await fetch(API_BASE+"/api/vectorize",{method:"POST",body:fd});
    if(!res.ok){
      const err=await res.json().catch(()=>({error:"Server error"}));
      throw new Error(err.error||"Vectorization failed");
    }
    const data=await res.json();
    wProgress=100;wStep="Finalizing";r();
    setTimeout(()=>{
      wResult=data.svg;
      wResultSize=data.sizeHuman||"—";
      wStatus="done";r();
    },300);
  }catch(err){
    console.warn("Backend unavailable, using local demo fallback:",err.message);
    runVecFallback();
  }
}

function runVecFallback(){
  const STEPS=["Analyzing colors","Tracing paths","Smoothing edges","Optimizing SVG","Finalizing"];
  const PCTS=[20,45,65,85,100];
  let i=0;
  const iv=setInterval(()=>{
    if(i<STEPS.length){wStep=STEPS[i];wProgress=PCTS[i];i++;r();}
    else{
      clearInterval(iv);
      setTimeout(()=>{
        wResult=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="140" height="140"><rect width="150" height="150" rx="13" fill="#0F172A"/><circle cx="75" cy="54" r="28" fill="#7C3AED" opacity=".85"/><circle cx="75" cy="54" r="18" fill="#A855F7" opacity=".9"/><rect x="32" y="88" width="86" height="38" rx="9" fill="#7C3AED" opacity=".75"/><rect x="48" y="100" width="54" height="14" rx="5" fill="#22D3EE" opacity=".9"/><text x="75" y="111" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#fff" opacity=".95">VECTORIZED</text><rect x="0" y="0" width="150" height="150" rx="13" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity=".35"/></svg>`;
        wResultSize="~12 KB (demo)";
        wStatus="done";r();
        toast("Backend not connected — showing demo result");
      },400);
    }
  },550);
}
function dlSVG(){
  if(!wResult)return;
  const b=new Blob([wResult],{type:"image/svg+xml"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download=(wFile?.name.replace(/\.[^.]+$/,"")||"output")+".svg";a.click();
  toast("SVG downloaded!");
}
function toast(msg){
  const t=document.getElementById("toast-ws");
  if(!t)return;
  t.textContent=msg;t.style.transform="translateX(-50%) translateY(0)";
  setTimeout(()=>{t.style.transform="translateX(-50%) translateY(60px)"},2200);
}

window.go=go;window.toggleFaq=toggleFaq;window.togglePFaq=togglePFaq;window.setMode=setMode;window.setDrag=setDrag;window.doDrop=doDrop;window.pickFile=pickFile;window.clearFile=clearFile;window.runVec=runVec;window.dlSVG=dlSVG;window.toast=toast;
window.wDetail=wDetail;window.wSmooth=wSmooth;window.wNoise=wNoise;window.wTransBg=wTransBg;window.wMerge=wMerge;
window.appear=appear;window.notifs=notifs;window.billing=billing;window.stab=stab;window.saved=saved;

r();
</script>
